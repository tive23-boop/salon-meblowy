name: Migracja katalogu do Sanity

# Uruchamiasz to recznie z zakladki "Actions" na GitHubie (przycisk "Run workflow").
# Nic nie trzeba instalowac lokalnie - wszystko dzieje sie na serwerach GitHuba.

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Zainstaluj zaleznosci
        run: npm install

      - name: Uruchom migracje
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: production
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
        run: npm run migrate
